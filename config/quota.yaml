# Optional cluster admission limits. Pods over the quota are rejected at creation and retried by the operator;
# pods that fit the quota but not the nodes stay Pending.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workspace-capacity
  namespace: paseo-workspaces
spec:
  hard:
    pods: '8'
    requests.cpu: '8'
    requests.memory: 16Gi
    limits.cpu: '16'
    limits.memory: 32Gi
    requests.storage: 80Gi
    persistentvolumeclaims: '8'
