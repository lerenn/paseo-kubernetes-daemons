# Bind this Role to the ServiceAccount running the MAIN daemon (not workspace pods).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paseo-workspaces-plugin
  namespace: paseo-workspaces
rules:
  - apiGroups: [workspaces.paseo.sh]
    resources: [paseoworkspaces]
    verbs: [get, list, create, patch, delete]
