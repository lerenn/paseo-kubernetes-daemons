apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: paseoworkspaces.workspaces.paseo.sh
spec:
  group: workspaces.paseo.sh
  scope: Namespaced
  names:
    plural: paseoworkspaces
    singular: paseoworkspace
    kind: PaseoWorkspace
    shortNames: [pw]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Endpoint
          type: string
          jsonPath: .status.endpoint
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            metadata:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 50
                  pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
            spec:
              type: object
              required: [image]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: Workspace specifications are immutable; create a new environment to change them
              properties:
                image:
                  type: string
                  minLength: 1
                gateway:
                  type: boolean
                  default: false
                docker:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    resources:
                      type: object
                      required: [requests, limits]
                      properties:
                        requests:
                          type: object
                          required: [cpu, memory, ephemeral-storage]
                          additionalProperties: {type: string}
                        limits:
                          type: object
                          required: [cpu, memory, ephemeral-storage]
                          additionalProperties: {type: string}
                    dataSize:
                      type: string
                      pattern: '^[1-9][0-9]*(Mi|Gi|Ti)$'
                ephemeral:
                  type: boolean
                  default: false
                workingDirectory:
                  type: string
                  enum: [/workspace, /workspace/repository]
                  default: /workspace
                bootstrap:
                  type: object
                  required: [secretName, configMapName, envSecretName]
                  properties:
                    secretName:
                      type: string
                      maxLength: 63
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                    configMapName:
                      type: string
                      maxLength: 63
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                    envSecretName:
                      type: string
                      maxLength: 63
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                    providers:
                      type: object
                      required: [secretName, configMapName, envSecretName]
                      properties:
                        secretName:
                          type: string
                          maxLength: 63
                          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                        configMapName:
                          type: string
                          maxLength: 63
                          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                        envSecretName:
                          type: string
                          maxLength: 63
                          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                        envKeys:
                          type: array
                          maxItems: 64
                          items:
                            type: string
                            maxLength: 253
                            pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
                        files:
                          type: array
                          maxItems: 3
                          items:
                            type: string
                            enum: [auth.json, .credentials.json, paseo-providers.json]
                        profiles:
                          type: array
                          maxItems: 64
                          items:
                            type: string
                            minLength: 1
                            maxLength: 64
                            pattern: '^[A-Za-z0-9_-]+$'
                        mcps:
                          type: array
                          maxItems: 64
                          items:
                            type: string
                            minLength: 1
                            maxLength: 128
                command:
                  type: array
                  minItems: 1
                  items: {type: string}
                secretName:
                  type: string
                storage:
                  type: string
                  default: 10Gi
                  pattern: '^[1-9][0-9]*(Mi|Gi|Ti)$'
                storageClassName:
                  type: string
                resources:
                  type: object
                  default:
                    requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 1Gi}
                    limits: {cpu: '2', memory: 4Gi, ephemeral-storage: 4Gi}
                  required: [requests, limits]
                  properties:
                    requests:
                      type: object
                      required: [cpu, memory, ephemeral-storage]
                      additionalProperties: {type: string}
                    limits:
                      type: object
                      required: [cpu, memory, ephemeral-storage]
                      additionalProperties: {type: string}
            status:
              type: object
              properties:
                message: {type: string}
                phase: {type: string}
                endpoint: {type: string}
                podUID: {type: string}
                observedGeneration: {type: integer, format: int64}
