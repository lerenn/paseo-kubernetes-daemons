# Optional: allow access only from labeled main-daemon pods in this namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-daemon-ingress
  namespace: paseo-daemons
spec:
  podSelector:
    matchExpressions:
      - key: daemons.paseo.sh/uid
        operator: Exists
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              daemons.paseo.sh/access: main
      ports:
        - protocol: TCP
          port: 6767
