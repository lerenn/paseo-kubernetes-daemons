apiVersion: v1
kind: Namespace
metadata:
  name: paseo-daemons
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paseo-daemons-operator
  namespace: paseo-daemons
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paseo-daemons-operator
  namespace: paseo-daemons
rules:
  - apiGroups: [daemons.paseo.sh]
    resources: [paseodaemons]
    verbs: [get, list, watch]
  - apiGroups: [daemons.paseo.sh]
    resources: [paseodaemons/status]
    verbs: [get, patch, update]
  - apiGroups: ['']
    resources: [pods, services, persistentvolumeclaims]
    verbs: [get, list, watch, create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ['']
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paseo-daemons-operator
  namespace: paseo-daemons
subjects:
  - kind: ServiceAccount
    name: paseo-daemons-operator
    namespace: paseo-daemons
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: paseo-daemons-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paseo-daemons-operator
  namespace: paseo-daemons
spec:
  replicas: 1
  selector:
    matchLabels: {app: paseo-daemons-operator}
  template:
    metadata:
      labels: {app: paseo-daemons-operator}
    spec:
      serviceAccountName: paseo-daemons-operator
      containers:
        - name: operator
          image: paseo-daemons-operator:dev
          args: [--namespace=paseo-daemons]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
