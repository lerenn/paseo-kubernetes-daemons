name: Release
# Merging a version bump to main releases it: if vX.Y.Z (plugin/package.json) has no tag yet, publish the
# operator image, the workspace image and the Helm chart (OCI) to ghcr.io, then create the tag and GitHub release.
# Idempotent: an already tagged version is a no-op. Re-run a failed release with workflow_dispatch on main.
on:
  push:
    branches: [main]
    paths: [plugin/package.json]
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(node -p 'require("./plugin/package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "v$version is already tagged: nothing to release"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - run: node .github/scripts/check-version.mjs
        if: steps.v.outputs.new == 'true'
      - uses: docker/login-action@v3
        if: steps.v.outputs.new == 'true'
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/setup-buildx-action@v3
        if: steps.v.outputs.new == 'true'
      - uses: docker/build-push-action@v6
        if: steps.v.outputs.new == 'true'
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/paseo-workspaces-operator:${{ steps.v.outputs.version }}
      - uses: docker/build-push-action@v6
        if: steps.v.outputs.new == 'true'
        with:
          context: images/workspace
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/paseo-workspace:${{ steps.v.outputs.version }}
      - name: Package and push the chart
        if: steps.v.outputs.new == 'true'
        run: |
          v='${{ steps.v.outputs.version }}'
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin
          helm package charts/paseo-workspaces --version "$v" --app-version "$v" -d out
          helm push "out/paseo-workspaces-$v.tgz" "oci://ghcr.io/${OWNER}/charts"
      - name: Create the vX.Y.Z tag and GitHub release
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.v.outputs.version }}" --target "$GITHUB_SHA" --title "v${{ steps.v.outputs.version }}" --generate-notes
