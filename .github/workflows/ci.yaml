name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: go test ./...
      - run: go vet ./...
      - run: python3 -m unittest discover -s images/workspace/tests -v
      - name: Test CRD admission and reconciliation against Kubernetes API
        run: |
          assets=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.3 use 1.35.x -p path)
          KUBEBUILDER_ASSETS="$assets" go test ./internal/controller -run TestAPIAdmission -v
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: plugin/package-lock.json}
      - run: npm ci && npm run typecheck && npm test
        working-directory: plugin
  workspace-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t paseo-workspace:test images/workspace
      - run: docker run --rm -i --network none --entrypoint python3 paseo-workspace:test - < images/workspace/tests/smoke.py
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chart CRD matches config/crd.yaml
        run: diff config/crd.yaml charts/paseo-workspaces/crds/paseoworkspaces.yaml
      - name: Lint and render the chart
        run: |
          for args in "" "--set gateway.enabled=true --set gateway.tls.secretName=x --set quota.enabled=true --set networkPolicy.enabled=true --set workspacePullSecret=x"; do
            docker run --rm -v "$PWD/charts:/c" alpine/helm:3 lint /c/paseo-workspaces $args
            docker run --rm -v "$PWD/charts:/c" alpine/helm:3 template pw /c/paseo-workspaces -n paseo-workspaces $args > /dev/null
          done
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Versions aligned (package.json, lock, Chart.yaml, DEFAULT_WORKSPACE_IMAGE); a bump must exceed the latest tag
        run: node .github/scripts/check-version.mjs "${{ github.event.pull_request.base.sha || 'HEAD' }}"
