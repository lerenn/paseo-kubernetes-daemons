{{- if .Values.pluginRole.enabled }}
# Bind this Role to the ServiceAccount running the MAIN daemon (not workspace pods).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paseo-daemons-plugin
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pw.labels" . | nindent 4 }}
rules:
  - apiGroups: [daemons.paseo.sh]
    resources: [paseodaemons]
    verbs: [get, list, create, patch, delete]
  - apiGroups: ['']
    resources: [secrets, configmaps]
    verbs: [get, create, patch]
  - apiGroups: ['']
    resources: [resourcequotas]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [paseo-daemons-operator]
    verbs: [get]
---
{{- end }}
{{- if .Values.pluginRole.clusterReadEnabled }}
# Optional: lets the Pods tab list storage classes (cluster-scoped). Bind it to the main daemon's ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-paseo-daemons-plugin-storageclasses
  labels: {{- include "pw.labels" . | nindent 4 }}
rules:
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list]
---
{{- end }}
{{- if .Values.quota.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workspace-capacity
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pw.labels" . | nindent 4 }}
spec:
  hard: {{- toYaml .Values.quota.hard | nindent 4 }}
---
{{- end }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-daemon-ingress
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: daemons.paseo.sh/uid
        operator: Exists
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              daemons.paseo.sh/access: main
      ports:
        - protocol: TCP
          port: 6767
---
{{- end }}
{{- if .Values.workspaceServiceAccount.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
{{- with .Values.workspacePullSecret }}
imagePullSecrets:
  - name: {{ . }}
{{- end }}
{{- end }}
