apiVersion: v1
kind: ServiceAccount
metadata:
  name: paseo-daemons-operator
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pw.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paseo-daemons-operator
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pw.labels" . | nindent 4 }}
rules:
  - apiGroups: [daemons.paseo.sh]
    resources: [paseodaemons]
    verbs: {{ if .Values.gateway.enabled }}[get, list, watch, create, update, delete]{{ else }}[get, list, watch]{{ end }}
  - apiGroups: [daemons.paseo.sh]
    resources: [paseodaemons/status]
    verbs: [get, patch, update]
  - apiGroups: ['']
    resources: [pods, services, persistentvolumeclaims]
    verbs: [get, list, watch, create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ['']
    resources: [events]
    verbs: [create, patch]
{{- if .Values.gateway.enabled }}
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [paseo-daemons-gateway]
    verbs: [get]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [create]
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [paseo-daemons-gateway-auth]
    verbs: [get]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paseo-daemons-operator
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pw.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: paseo-daemons-operator
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: paseo-daemons-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paseo-daemons-operator
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pw.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: paseo-daemons-operator}
  template:
    metadata:
      labels: {app: paseo-daemons-operator}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: paseo-daemons-operator
      containers:
        - name: operator
          image: {{ include "pw.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --namespace={{ .Release.Namespace }}
            {{- if .Values.workspacePullSecret }}
            - --workspace-pull-secret={{ .Values.workspacePullSecret }}
            {{- end }}
            - --default-workspace-image={{ .Values.workspaceImage | default (printf "ghcr.io/lerenn/paseo-daemon:%s" .Chart.AppVersion) }}
            - --docker-image={{ .Values.docker.image }}
            - --docker-mtu={{ .Values.docker.mtu }}
            {{- with .Values.docker.registryMirrors }}
            - --docker-registry-mirror={{ join "," . }}
            {{- end }}
            {{- if .Values.gateway.enabled }}
            - --gateway-listen=:{{ .Values.gateway.port }}
            {{- with .Values.gateway.hostnames }}
            - --gateway-hostnames={{ join "," . }}
            {{- end }}
            {{- end }}
          {{- if .Values.gateway.enabled }}
          ports:
            - {name: gateway, containerPort: {{ .Values.gateway.port }}}
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
        {{- if and .Values.gateway.enabled .Values.gateway.tls.secretName }}
        # TLS in front of the plain-websocket gateway; the Secret is reloaded daily for renewals.
        - name: gateway-tls
          image: {{ .Values.gateway.tls.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              nginx -g 'daemon off;' &
              pid=$!
              trap 'stop=1; kill -QUIT "$pid"' TERM INT
              while [ -z "$stop" ] && kill -0 "$pid" 2>/dev/null; do
                sleep 86400 & wait $!
                [ -z "$stop" ] && nginx -s reload
              done
              wait "$pid"
          ports:
            - {name: gateway-tls, containerPort: {{ .Values.gateway.tls.port }}}
          readinessProbe:
            tcpSocket: {port: gateway-tls}
            periodSeconds: 10
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: gateway-tls-config, mountPath: /etc/nginx/conf.d, readOnly: true}
            - {name: gateway-tls, mountPath: /etc/paseo-daemons-gateway-tls, readOnly: true}
      volumes:
        - name: gateway-tls-config
          configMap: {name: paseo-daemons-gateway-tls}
        - name: gateway-tls
          secret: {secretName: {{ .Values.gateway.tls.secretName | quote }}}
        {{- end }}
{{- if .Values.gateway.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: paseo-daemons-gateway
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pw.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app: paseo-daemons-operator}
  ports:
    - {name: gateway, port: {{ .Values.gateway.port }}, targetPort: gateway}
{{- end }}
{{- if and .Values.gateway.enabled .Values.gateway.tls.secretName }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: paseo-daemons-gateway-tls
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pw.labels" . | nindent 4 }}
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    server {
        listen {{ .Values.gateway.tls.port }} ssl;
        ssl_certificate /etc/paseo-daemons-gateway-tls/tls.crt;
        ssl_certificate_key /etc/paseo-daemons-gateway-tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / {
            proxy_pass http://127.0.0.1:{{ .Values.gateway.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
        }
    }
---
# https (443): in-cluster clients that need TLS, e.g. a CoreDNS rewrite of the public gateway name.
apiVersion: v1
kind: Service
metadata:
  name: paseo-daemons-gateway-tls
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pw.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app: paseo-daemons-operator}
  ports:
    - {name: https, port: 443, targetPort: gateway-tls}
{{- end }}
