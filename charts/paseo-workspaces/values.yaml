image:
  repository: ghcr.io/lerenn/paseo-workspaces-operator
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent
# Pull Secrets for the operator pod.
imagePullSecrets: []
# Workspace image for gateway profiles that set none. Defaults to paseo-workspace:<appVersion>.
workspaceImage: ""
# Pull Secret used by the workspace pods the operator creates.
workspacePullSecret: ""
# Docker-in-Docker sidecar of workspaces with spec.docker.enabled (privileged container).
docker:
  # Pin by digest if your cluster only admits digest-pinned images.
  image: docker:29.0.0-dind
  # MTU of dockerd and its default bridge networks (0 keeps Docker's default).
  mtu: 1450
  # Docker Hub mirrors (--registry-mirror); must be reachable from the workspace namespace.
  registryMirrors: []
resources:
  requests: {cpu: 50m, memory: 128Mi, ephemeral-storage: 16Mi}
  limits: {cpu: 500m, memory: 256Mi, ephemeral-storage: 64Mi}

# Opt-in virtual "<Name> · Kubernetes" host served by the operator process. It is
# reachable only through an internal ClusterIP Service and widens the operator's
# permissions (create/update/delete workspaces, catalog and identity Secrets).
gateway:
  enabled: false
  port: 8787
  # Extra DNS names the gateway accepts in addition to its Service names.
  hostnames: []
  # TLS-terminating nginx sidecar + Service "paseo-workspaces-gateway-tls" (443). Set secretName to a
  # kubernetes.io/tls Secret in the release namespace to enable; empty keeps the plain gateway only.
  tls:
    secretName: ""
    port: 8788
    image: docker.io/nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03

# Role for the ServiceAccount running the MAIN daemon (the companion plugin). Bind it yourself.
pluginRole:
  enabled: true

# Optional admission limits. Excess pods stay Pending until capacity is freed.
quota:
  enabled: false
  hard:
    pods: "8"
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    requests.storage: 80Gi
    persistentvolumeclaims: "8"

# Optional: only labeled main-daemon pods (workspaces.paseo.sh/access=main) reach workspace daemons.
networkPolicy:
  enabled: false

# Stop workspace pods from mounting the default ServiceAccount token.
workspaceServiceAccount:
  enabled: true
